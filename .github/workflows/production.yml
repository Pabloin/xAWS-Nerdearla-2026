name: Comunid Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested release to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: comunid-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform/environments/production

jobs:
  production:
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: hashicorp/setup-terraform@v3
      - run: npm ci
      - run: npm run check
      - run: npm --workspace @comunid/backend run package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.COMUNID_PRODUCTION_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_github_repo_id: ${{ github.repository_id }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.COMUNID_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.COMUNID_CLOUDFLARE_API_TOKEN }}
          TF_STATE_BUCKET: ${{ secrets.COMUNID_TERRAFORM_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_VAR_cloudflare_zone_id"
          test -n "$CLOUDFLARE_API_TOKEN"
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=comunid/production/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -out=tfplan
      - name: Reject destructive plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json
          if jq -e '[.resource_changes[]?.change.actions | select(index("delete"))] | length > 0' tfplan.json; then
            echo "Destructive infrastructure change rejected."
            exit 1
          fi
      - name: Apply infrastructure
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_zone_id: ${{ secrets.COMUNID_CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.COMUNID_CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve tfplan
      - name: Capture outputs
        id: resources
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform output -raw web_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "lambda=$(terraform output -raw lambda_name)" >> "$GITHUB_OUTPUT"
          echo "app_role=$(terraform output -raw github_app_role_arn)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.resources.outputs.app_role }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ steps.resources.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.resources.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.resources.outputs.cognito_client_id }}
          VITE_APP_URL: https://mobile.comunid.app/
          VITE_PUBLIC_APP_URL: https://mobile.comunid.app
          VITE_HOME_URL: https://comunid.app/
          VITE_MOBILE_BASE: /app/
          VITE_ADMIN_BASE: /admin/
        run: |
          test -n "$VITE_COGNITO_USER_POOL_ID"
          test -n "$VITE_COGNITO_CLIENT_ID"
          npm run build
      - run: npm --workspace @comunid/backend run package
      - run: aws s3 sync front_home/dist "s3://${{ steps.resources.outputs.bucket }}" --delete --exclude 'app/*' --exclude 'admin/*'
      - run: aws s3 sync front_mobile/dist "s3://${{ steps.resources.outputs.bucket }}/app" --delete
      - run: aws s3 sync front_admin/dist "s3://${{ steps.resources.outputs.bucket }}/admin" --delete
      - run: aws lambda update-function-code --function-name "${{ steps.resources.outputs.lambda }}" --zip-file fileb://backend/dist/api.zip
      - run: aws cloudfront create-invalidation --distribution-id "${{ steps.resources.outputs.distribution }}" --paths "/*"
